<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Shin'Ly | Cyberpunk Nexus</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts: Cyberpunk edge -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0a0f1a, #03060c);
      background-attachment: fixed;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* efek grid cyberpunk */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 35px 35px;
      pointer-events: none;
      z-index: 0;
    }

    /* glitch line effect */
    .glow-text {
      text-shadow: 0 0 5px #00ffff88, 0 0 10px #3a86ff;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* header cyber */
    .cyber-header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 1rem 0;
      border-bottom: 2px solid #0ff;
      box-shadow: 0 5px 20px rgba(0, 255, 255, 0.2);
      background: rgba(10, 20, 30, 0.5);
      backdrop-filter: blur(3px);
      border-radius: 0 0 40px 40px;
    }

    .cyber-header h1 {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #88ccff, #00aaff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
    }

    .cyber-header p {
      color: #b0e0ff;
      letter-spacing: 2px;
      font-size: 0.9rem;
    }

    /* 3 opsi utama */
    .menu-opsi {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin: 2rem 0 2.5rem;
    }

    .btn-cyber {
      background: rgba(20, 30, 45, 0.7);
      backdrop-filter: blur(8px);
      border: 1.5px solid #3a86ff;
      color: #eef4ff;
      padding: 1rem 2.3rem;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 8px #3a86ff66;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .btn-cyber i {
      font-size: 1.6rem;
      color: #0ff;
    }

    .btn-cyber:hover {
      transform: scale(1.03);
      background: #1e2a3e;
      border-color: #0ff;
      box-shadow: 0 0 18px #00ffffaa;
      color: white;
    }

    /* panel konten utama */
    .content-panel {
      background: rgba(15, 25, 35, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 48px;
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 2rem;
      min-height: 500px;
      transition: all 0.2s ease;
      box-shadow: 0 20px 35px rgba(0,0,0,0.5);
    }

    /* produk grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.7rem;
      margin-top: 1rem;
    }

    .product-card {
      background: #ffffff0c;
      border: 1px solid #4a6e9e;
      border-radius: 32px;
      padding: 1.4rem;
      transition: 0.2s;
      cursor: pointer;
      backdrop-filter: blur(4px);
      background: linear-gradient(145deg, #ffffff08, #aaccff08);
    }

    .product-card:hover {
      border-color: #0ff;
      transform: translateY(-5px);
      background: #ffffff18;
      box-shadow: 0 8px 20px rgba(0,200,255,0.2);
    }

    .product-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #f0fcff;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .price {
      font-size: 1.3rem;
      font-family: monospace;
      background: #00000055;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      color: #88ddff;
    }

    .product-desc {
      margin-top: 12px;
      color: #bbd4ff;
      font-size: 0.85rem;
    }

    .special-label {
      background: #0ff22d33;
      border-left: 4px solid #0ff;
      padding-left: 8px;
    }

    hr {
      border-color: #3a86ff33;
      margin: 16px 0;
    }

    /* payment & sosial media style */

      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
    }
    .payment-card {
      background: #f0f5fb;
      border-radius: 32px;
      padding: 1.5rem;
      width: 100%;
      max-width: 450px;
      text-align: center;
      color: #1f2a3e;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .payment-card h3 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #0a4b6e;
    }
    .qr-img {
      max-width: 220px;
      border-radius: 28px;
      border: 2px solid #aaa;
      margin: 12px 0;
    }
    .sosmed-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
      padding: 2rem;
    }
    .sosmed-card {
      background: #eef3fc;
      border-radius: 45px;
      padding: 1.2rem 2rem;
      width: 280px;
      text-align: center;
      transition: 0.2s;
      font-weight: bold;
      font-size: 1.3rem;
      color: #033b5e;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      border: 1px solid #54c0ff;
    }
    .sosmed-card i {
      font-size: 2rem;
    }

    .backdrop-blur {
      background: #ffffffd9;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      color: #8aaacb;
      font-size: 13px;
    }
    button, .product-card {
      cursor: pointer;
    }
    .info-note {
      font-size: 0.75rem;
      color: #8aa5d0;
      margin-top: 8px;
    }
    @media (max-width: 680px) {
      .btn-cyber { padding: 0.6rem 1.2rem; font-size: 1rem; }
      .product-title { font-size: 1.2rem; }
      .cyber-header h1 { font-size: 2rem; }
    }
  </style>
</head>
